        details:
          type: "object"
          additionalProperties: true
          description: "Small structured context (D section 2.8). For interaction.logged: task_id (uuid) and outcome (token) - the correlation that ties the interaction and its task to one submission (api-contract.md section 12, answer 4)."
    Pagination:
