    CreateCompanyRequest:
      type: "object"
      required:
        - "name"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 300
          description: "Required; non-empty after trimming leading/trailing whitespace; trimmed value is stored."
    CreateContactRequest:
      type: "object"
      required:
        - "full_name"
      additionalProperties: false
      properties:
        full_name:
          type: "string"
          minLength: 1
          maxLength: 300
          description: "Required; non-empty after trim."
        email:
          type: "string"
          nullable: true
          description: "Optional; omitted and null are equivalent. No format validation beyond length in this slice."
        phone:
          type: "string"
          nullable: true
          description: "Optional; omitted and null are equivalent."
    LogInteractionRequest:
      type: "object"
      required:
        - "outcome"
        - "next_action_date"
      additionalProperties: false
      description: "Closed request body (additionalProperties: false). occurred_at is assigned server-side at write time; it is not a request field, and any client attempt to supply it is rejected by this closed schema as an unknown field via the standard validation_failed response. Likewise no kind (fixed to call), no title (server-generated), no IDs. The server-assigned occurred_at is returned in the response's interaction object."
      properties:
        outcome:
          "$ref": "#/components/schemas/OutcomeToken"
        notes:
          type: "string"
          nullable: true
        next_action_date:
          type: "string"
          format: "date"
          description: "Must be today or later, where today is the current date in the tenant's operating_timezone (P section 5.2); server-evaluated."
    LogInteractionResponse:
      type: "object"
      required:
        - "interaction"
        - "task"
      additionalProperties: false
      description: "Returned with 201 on creation and byte-equivalent with 200 on idempotent replay; both carry the same interaction and task IDs (AC-3). Includes the complete next-action task record (generated title, due_on, status open) so the confirmation UI needs no additional request (api-contract.md section 12, answer 3)."
      properties:
        interaction:
          "$ref": "#/components/schemas/Interaction"
        task:
          "$ref": "#/components/schemas/Task"
    PublicationDetail:
      type: "object"
      required:
        - "attempt_count"
        - "last_error"
      additionalProperties: false
      properties:
        attempt_count:
          type: "integer"
          minimum: 0
          description: "Publication attempts so far."
        last_error:
          type: "string"
          nullable: true
          description: "Only the contractually sanitized error code and safe operator summary (WAVE1_FREEZE Obligation 2); never credentials, tokens, payload contents, notes, email bodies, or Kafka topic/partition/offset detail."
    ProcessingStatus:
      type: "object"
      description: "Event-processing inspection (WAVE1_FREEZE Obligation 3; P section 6.4; D section 7.1). State precedence, first match wins: processed, failed, published, pending (pending includes an active publication lease). RESPONSE ALLOWLIST (defense in depth): only the properties declared in this schema may ever appear; the response never contains Kafka topic, Kafka partition, Kafka offset, outbox seq, claim_id, claimed_by, lease_expires_at, the raw envelope payload, or any cross-tenant data. last_error fields carry only the sanitized error code and safe summary (Node E bans topic/partition/offset from last_error at the source; this allowlist is the API's defense-in-depth layer)."
      required:
        - "interaction_id"
        - "event_id"
        - "event_type"
        - "state"
        - "staged_at"
        - "published_at"
        - "processed_at"
        - "publication"
        - "consumer"
        - "failure"
      additionalProperties: false
      properties:
        interaction_id:
          type: "string"
          format: "uuid"
        event_id:
          type: "string"
          format: "uuid"
          description: "The outbox event id; equals the envelope's event_id (frozen Node E seam, D section 2.9)."
        event_type:
          type: "string"
          description: "interaction.logged in this slice."
        state:
          type: "string"
          enum:
            - "pending"
            - "published"
            - "processed"
            - "failed"
        staged_at:
          type: "string"
          format: "date-time"
          description: "When the outbox row was committed with the interaction (same transaction)."
        published_at:
          type: "string"
          format: "date-time"
          nullable: true
        processed_at:
          type: "string"
          format: "date-time"
          nullable: true
        publication:
          "$ref": "#/components/schemas/PublicationDetail"
        consumer:
          type: "object"
          nullable: true
          description: "The required consumer's receipt detail. MUST be null before a receipt exists (inline nullable object; valid OpenAPI 3.0.3 composition)."
          required:
            - "status"
            - "attempt_count"
            - "first_seen_at"
            - "last_attempt_at"
            - "processed_at"
            - "last_error"
          additionalProperties: false
          properties:
            status:
              type: "string"
              enum:
                - "processing"
                - "processed"
                - "failed"
            attempt_count:
              type: "integer"
              minimum: 1
            first_seen_at:
              type: "string"
              format: "date-time"
            last_attempt_at:
              type: "string"
              format: "date-time"
            processed_at:
              type: "string"
              format: "date-time"
              nullable: true
            last_error:
              type: "string"
              nullable: true
              description: "Sanitized error code + safe summary only (Obligation 2); never Kafka topic/partition/offset detail."
        failure:
          type: "object"
          nullable: true
          description: "MUST be null whenever state is not failed; non-null iff state is failed (inline nullable object; valid OpenAPI 3.0.3 composition)."
          required:
            - "failure_stage"
            - "last_error"
            - "secondary"
          additionalProperties: false
          properties:
            failure_stage:
              type: "string"
              enum:
                - "publication"
                - "consumer"
              description: "publication when the outbox is failed (including when both stages failed - tie-break per P section 6.4); consumer when only the receipt is failed."
            last_error:
              type: "string"
              description: "Sanitized last error of the reported failure_stage (Obligation 2); never Kafka topic/partition/offset detail."
            secondary:
              type: "object"
              nullable: true
              description: "Secondary consumer diagnostic under the publication-first tie-break. MUST be null unless BOTH failure stages hold evidence (P section 6.4). Presentation precedence only; no failure record is erased."
              required:
                - "stage"
                - "last_error"
                - "attempt_count"
                - "last_attempt_at"
              additionalProperties: false
              properties:
                stage:
                  type: "string"
                  enum:
                    - "consumer"
                last_error:
                  type: "string"
                  nullable: true
                  description: "Sanitized per Obligation 2."
                attempt_count:
                  type: "integer"
                last_attempt_at:
                  type: "string"
                  format: "date-time"
