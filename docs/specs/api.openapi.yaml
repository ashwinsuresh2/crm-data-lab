        notes:
          type: "string"
          nullable: true
        occurred_at:
          type: "string"
          format: "date-time"
          description: "Server-assigned transaction time (D section 2.6); never client-supplied."
        created_by:
          "$ref": "#/components/schemas/ActorRef"
        created_at:
          type: "string"
          format: "date-time"
    Task:
      type: "object"
      required:
        - "id"
        - "tenant_id"
        - "contact_id"
        - "interaction_id"
        - "title"
        - "due_on"
        - "status"
        - "assigned_to"
        - "created_at"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        tenant_id:
          type: "string"
          format: "uuid"
        contact_id:
          type: "string"
          format: "uuid"
        interaction_id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
          description: "Server-generated from P's outcome-to-title table; never client-supplied."
        due_on:
          type: "string"
          format: "date"
          description: "Calendar date (next-action date), interpreted against the tenant's operating_timezone (D)."
        status:
          type: "string"
          enum:
            - "open"
          description: "Always open on this API surface: every Sprint-0001 task is created open, no endpoint completes tasks, and GET /v1/tasks returns open tasks only (P section 8). The database models open|done (D section 2.7); exposing done is a future additive change."
        assigned_to:
          type: "string"
          format: "uuid"
        created_at:
          type: "string"
          format: "date-time"
    TaskListItem:
      type: "object"
      description: "Denormalized home-screen row (P section 3.1)."
      required:
        - "id"
        - "tenant_id"
        - "title"
        - "due_on"
        - "status"
        - "contact"
        - "company"
        - "interaction_id"
        - "interaction_outcome"
        - "created_at"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        tenant_id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        due_on:
          type: "string"
          format: "date"
        status:
          type: "string"
